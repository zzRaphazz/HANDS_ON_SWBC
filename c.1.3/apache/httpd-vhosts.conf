<VirtualHost *:80>
    ServerName site1.local
    DocumentRoot "/usr/local/apache2/htdocs/1site.local"
    <Directory "/usr/local/apache2/htdocs/1site.local">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/site1_error.log"
    CustomLog "logs/site1_access.log" common
</VirtualHost>

<VirtualHost *:80>
    ServerName site2.local
    DocumentRoot "/usr/local/apache2/htdocs/2site.local"
    <Directory "/usr/local/apache2/htdocs/2site.local">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/site2_error.log"
    CustomLog "logs/site2_access.log" common
</VirtualHost>
